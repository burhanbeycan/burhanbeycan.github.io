[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-electrolyte-lab"
version = "0.2.0"
description = "Nernst–Einstein estimates and reference-frame-explicit collective Onsager transport."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Burhan Beycan"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "polymer-research-workbench==0.2.0"]

[project.scripts]
polymer-electrolyte-lab = "polymer_electrolyte_lab.cli:main"

[project.urls]
Repository = "https://github.com/burhanbeycan/polymer-electrolyte-lab"

[tool.setuptools.packages.find]
where = ["src"]
