[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-synthesis-lab"
version = "0.2.0"
description = "Functional-group balances, ideal chain-growth mass bookkeeping and terminal copolymer composition."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Burhan Beycan"}]
dependencies = ["numpy>=1.24,<3", "polymer-research-workbench==0.2.0"]

[project.scripts]
polymer-synthesis-lab = "polymer_synthesis_lab.cli:main"

[project.urls]
Repository = "https://github.com/burhanbeycan/polymer-synthesis-lab"

[tool.setuptools.packages.find]
where = ["src"]
