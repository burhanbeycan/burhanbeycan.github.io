name: Scientific checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[test]'
      - name: Install the six independent laboratory repositories
        run: >-
          python -m pip install
          git+https://github.com/burhanbeycan/burhanbeycan.github.io.git@polymer-research-review-v0.2.0#subdirectory=polymer-research/polymer-chemistry-lab
          git+https://github.com/burhanbeycan/burhanbeycan.github.io.git@polymer-research-review-v0.2.0#subdirectory=polymer-research/polymer-synthesis-lab
          git+https://github.com/burhanbeycan/burhanbeycan.github.io.git@polymer-research-review-v0.2.0#subdirectory=polymer-research/polymer-chain-lab
          git+https://github.com/burhanbeycan/burhanbeycan.github.io.git@polymer-research-review-v0.2.0#subdirectory=polymer-research/polymer-transport-lab
          git+https://github.com/burhanbeycan/burhanbeycan.github.io.git@polymer-research-review-v0.2.0#subdirectory=polymer-research/polymer-network-lab
          git+https://github.com/burhanbeycan/burhanbeycan.github.io.git@polymer-research-review-v0.2.0#subdirectory=polymer-research/polymer-electrolyte-lab
      - run: python -m unittest discover -s tests -v
