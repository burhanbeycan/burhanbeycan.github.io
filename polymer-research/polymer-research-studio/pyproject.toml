[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-research-workbench"
version = "0.2.0"
description = "Shared local GUI, material exchange protocol and integrated launcher for independent polymer research applications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Burhan Beycan"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
polymer-workbench = "polymer_workbench.server:main"
polymer-studio = "polymer_workbench.server:main"

[project.urls]
Repository = "https://github.com/burhanbeycan/polymer-research-studio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polymer_workbench = ["static/*.html", "static/*.css", "static/*.js"]
